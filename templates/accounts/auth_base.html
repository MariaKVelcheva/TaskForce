{% extends 'common/base.html' %}
{% block extra_css %}
<style>
    .auth-wrap { max-width: 420px; margin: 0 auto; }

    .auth-head { margin-bottom: 2rem; text-align: center; }

    .auth-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--khaki);
    }

    .auth-subtitle {
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 0.4rem;
    }

    .auth-note {
        font-size: 0.92rem;
        color: var(--cream-dark);
        line-height: 1.6;
        margin-bottom: 1rem;
    }

    .auth-actions { margin-top: 1.75rem; }
    .auth-actions .btn { width: 100%; text-align: center; }

    .auth-links {
        font-size: 0.83rem;
        color: var(--muted);
        text-align: center;
        margin-top: 1rem;
        line-height: 1.8;
    }

    .auth-links a { color: var(--khaki); text-decoration: none; }
    .auth-links a:hover { color: var(--cream); }

    
    .field-help ul { list-style: none; }
    .field-help li::before { content: "· "; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">

    <div class="auth-head">
        <h1 class="auth-title">{% block heading %}{% endblock %}</h1>
        <p class="auth-subtitle">{% block subheading %}{% endblock %}</p>
    </div>

    <div class="panel">
        <div class="panel-header">{% block panel_header %}{% endblock %}</div>
        {% block card %}{% endblock %}
    </div>

    {% block below %}{% endblock %}

</div>
{% endblock %}
