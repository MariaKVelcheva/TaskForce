{% load i18n %}
<dialog id="{{ id }}{{ id_suffix }}" class="confirm-dialog" aria-labelledby="{{ id }}{{ id_suffix }}-title">
  <form method="post" action="{{ action }}" class="confirm-dialog__body">
    {% csrf_token %}
    <h2 id="{{ id }}{{ id_suffix }}-title">{{ title }}</h2>
    <p>{{ message }}</p>
      {% if items %}
      <p>{{ items_intro }}</p>
      <ul class="confirm-dialog__list">
        {% for item in items %}<li>{{ item }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% if reset_checkbox %}
      <label>
        <input type="checkbox" name="reset_code" checked>
        {% translate "Also reset the invite code (old invite links will stop working)" %}
      </label>
    {% endif %}
    <div class="confirm-dialog__actions">
      <button type="submit" formmethod="dialog" formnovalidate autofocus class="btn btn-ghost">{% translate "Cancel" %}</button>
      <button type="submit" class="btn btn-danger">{{ confirm }}</button>
    </div>
  </form>
</dialog>
