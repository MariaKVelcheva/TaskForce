<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <style>
      .grass       { fill: #8c955a; }
      .grass-dark  { fill: #737c46; }
      .road        { fill: #c4b183; }
      .road-edge   { fill: #a8956a; }
      .water       { fill: #4e6b6a; }
      .wave        { fill: none; stroke: #7f9b92; stroke-width: 1.2; stroke-linecap: round; }
      .leaf        { fill: #4a5530; }
      .leaf-light  { fill: #5d6a3b; }
      .trunk       { fill: #5b4630; }
      .shadow      { fill: #000; opacity: .22; }
      .canvas      { fill: #b7a777; }
      .canvas-dark { fill: #968659; }
      .steel       { fill: #6f7462; }
      .steel-dark  { fill: #545846; }
      .wood        { fill: #8f6f45; }
      .wood-dark   { fill: #6e5332; }
      .door        { fill: #3a3a2c; }
      .flag        { fill: #9c4a2f; }
      .pole        { fill: #3a3a2c; }
      .sandbag     { fill: #a99a6b; stroke: #847650; stroke-width: .6; }
    </style>

    <symbol id="tile-grass" viewBox="0 0 32 32">
      <rect class="grass" width="32" height="32"/>
      <path class="grass-dark" d="M6 9l1-3 1 3zM22 6l1-3 1 3zM14 22l1-3 1 3zM26 25l1-3 1 3zM4 27l1-3 1 3z"/>
    </symbol>

    <symbol id="tile-road" viewBox="0 0 32 32">
      <rect class="road" width="32" height="32"/>
      <circle class="road-edge" cx="7" cy="9" r="1"/>
      <circle class="road-edge" cx="20" cy="5" r=".8"/>
      <circle class="road-edge" cx="25" cy="21" r="1"/>
      <circle class="road-edge" cx="11" cy="25" r=".8"/>
    </symbol>

    <symbol id="tile-water" viewBox="0 0 32 32">
      <rect class="water" width="32" height="32"/>
      <path class="wave" d="M4 10q3-3 6 0t6 0M16 22q3-3 6 0t6 0"/>
    </symbol>

    <symbol id="tile-forest" viewBox="0 0 32 32">
      <rect class="grass" width="32" height="32"/>
      <ellipse class="shadow" cx="10" cy="15" rx="7" ry="2.5"/>
      <rect class="trunk" x="9" y="11" width="2" height="4"/>
      <circle class="leaf" cx="10" cy="8" r="6"/>
      <circle class="leaf-light" cx="8" cy="6" r="2.5"/>
      <ellipse class="shadow" cx="22" cy="29" rx="7" ry="2.5"/>
      <rect class="trunk" x="21" y="25" width="2" height="4"/>
      <circle class="leaf" cx="22" cy="21" r="6.5"/>
      <circle class="leaf-light" cx="20" cy="19" r="2.5"/>
    </symbol>

    <!-- note for BUILDINGS: 32 × 48, drawn 16px taller than their tile -->
    <!-- The bottom 32px sit on the tile; the top 16px overlap the row above (HoMM-style 3/4 view). -->

    <symbol id="building-hq" viewBox="0 0 32 48">
      <ellipse class="shadow" cx="16" cy="44" rx="15" ry="3.5"/>
      <rect class="steel-dark" x="4" y="26" width="24" height="16"/>
      <rect class="steel" x="4" y="22" width="24" height="6"/>
      <rect class="door" x="13" y="32" width="6" height="10"/>
      <rect class="sandbag" x="1" y="38" width="7" height="4" rx="2"/>
      <rect class="sandbag" x="24" y="38" width="7" height="4" rx="2"/>
      <rect class="sandbag" x="3" y="35" width="6" height="4" rx="2"/>
      <rect class="sandbag" x="23" y="35" width="6" height="4" rx="2"/>
      <rect class="pole" x="15.3" y="3" width="1.4" height="20"/>
      <path class="flag" d="M16.7 3h10l-2.5 3.5 2.5 3.5h-10z"/>
    </symbol>

    <symbol id="building-training" viewBox="0 0 32 48">
      <ellipse class="shadow" cx="16" cy="44" rx="13" ry="3"/>
      <rect class="wood-dark" x="7" y="26" width="2.5" height="17"/>
      <rect class="wood-dark" x="22.5" y="26" width="2.5" height="17"/>
      <rect class="wood" x="5" y="12" width="22" height="20" rx="1"/>
      <circle cx="16" cy="22" r="7.5" fill="#e8dcb8"/>
      <circle cx="16" cy="22" r="5" fill="#9c4a2f"/>
      <circle cx="16" cy="22" r="2.6" fill="#e8dcb8"/>
      <circle cx="16" cy="22" r="1" fill="#9c4a2f"/>
    </symbol>

    <symbol id="building-supply" viewBox="0 0 32 48">
      <ellipse class="shadow" cx="16" cy="44" rx="15" ry="3.5"/>
      <rect class="wood" x="2" y="30" width="14" height="13"/>
      <rect class="wood" x="16" y="30" width="14" height="13"/>
      <rect class="wood" x="9" y="17" width="14" height="13"/>
      <path class="wood-dark" d="M2 30l14 13M16 30l-14 13M16 30l14 13M30 30l-14 13M9 17l14 13M23 17l-14 13" stroke="#6e5332" stroke-width="1.4"/>
      <rect fill="none" stroke="#6e5332" stroke-width="1.4" x="2" y="30" width="14" height="13"/>
      <rect fill="none" stroke="#6e5332" stroke-width="1.4" x="16" y="30" width="14" height="13"/>
      <rect fill="none" stroke="#6e5332" stroke-width="1.4" x="9" y="17" width="14" height="13"/>
    </symbol>

    <symbol id="building-barracks" viewBox="0 0 32 48">
      <ellipse class="shadow" cx="16" cy="44" rx="15" ry="3.5"/>
      <path class="steel" d="M2 43V30a14 14 0 0 1 28 0v13z"/>
      <path class="steel-dark" d="M7 43V30a9 9 0 0 1 18 0v13z" opacity=".35"/>
      <path d="M6 22v21M11 18v25M16 16v27M21 18v25M26 22v21" stroke="#545846" stroke-width=".8"/>
      <rect class="door" x="13" y="34" width="6" height="9"/>
      <rect fill="#d9cfa0" x="5" y="33" width="4" height="3"/>
      <rect fill="#d9cfa0" x="23" y="33" width="4" height="3"/>
    </symbol>


    <symbol id="building-rec_room" viewBox="0 0 32 48">
      <ellipse class="shadow" cx="16" cy="44" rx="15" ry="3.5"/>
      <path class="canvas" d="M2 43L16 17l14 26z"/>
      <path class="canvas-dark" d="M16 17l14 26h-8z"/>
      <path class="door" d="M12 43l4-11 4 11z"/>
      <rect class="pole" x="15.3" y="12" width="1.4" height="6"/>
      <circle cx="16" cy="11" r="2.2" fill="#f0c862"/>
    </symbol>
  </defs>
</svg>
