<script>
(function () {
    if (window.itemBlocksBound) return;
    window.itemBlocksBound = true;
    
        function normalise(text) {
        return text.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim();
    }

    function applySearch(input) {
        const block = input.closest(".items-block");
        const query = normalise(input.value);
        let shown = 0;
        block.querySelectorAll(".item-list .item-row").forEach((row) => {
            const name = normalise(row.querySelector(".item-name")?.textContent ?? "");
            row.hidden = query !== "" && !name.includes(query);
            if (!row.hidden) shown += 1;
        });
        const empty = block.querySelector("[data-search-empty]");
        if (empty) empty.hidden = shown > 0;
    }

    function replaceBlock(current, fresh) {
        const search = current.querySelector("[data-search-list]");
        const query = search ? search.value : "";
        const list = current.querySelector(".item-list");
        const scroll = list ? list.scrollTop : 0;

        current.replaceWith(fresh);

        const freshSearch = fresh.querySelector("[data-search-list]");
        if (freshSearch && query) {
            freshSearch.value = query;
            applySearch(freshSearch);
        }
        const freshList = fresh.querySelector(".item-list");
        if (freshList) freshList.scrollTop = scroll;
    }

    async function refreshAllBlocks() {
        const response = await fetch(window.location.href);
        if (!response.ok) { window.location.reload(); return; }
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
                page.querySelectorAll("[data-block]").forEach((fresh) => {
            const current = document.querySelector(`[data-block="${fresh.dataset.block}"]`);
            if (current) replaceBlock(current, document.adoptNode(fresh));
        });
    }

    async function send(form, submitter) {
        const block = form.closest(".items-block");
        const key = block.dataset.block;
        const wasAdd = form.classList.contains("item-add");

        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form, submitter),
            headers: { "X-Requested-With": "fetch" },
        });
        if (!response.ok) { form.submit(); return; }

                if (block.dataset.refresh === "page" || document.querySelectorAll(".items-block").length > 1) {
            await refreshAllBlocks();
        } else {
            const holder = document.createElement("div");
            holder.innerHTML = await response.text();
            replaceBlock(block, holder.querySelector(".items-block"));
        }

        if (wasAdd) {
            const fresh = document.querySelector(`.items-block[data-block="${key}"]`)
                || document.querySelector(".items-block");
            const input = fresh && fresh.querySelector(".item-add-name");
            if (input) input.focus();
        }
    }

    document.addEventListener("submit", (event) => {
        const form = event.target;
        if (!form.closest(".items-block")) return;
        event.preventDefault();
        send(form, event.submitter);
    });

    document.addEventListener("change", (event) => {
        if (event.target.matches(".item-amount-input")) {
            event.target.form.requestSubmit();
        }
    });
    
        document.addEventListener("input", (event) => {
        if (event.target.matches("[data-search-list]")) applySearch(event.target);
    });
})();
</script>
