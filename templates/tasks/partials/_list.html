<div class="items-block">
    <div class="items-header">
        <span class="items-title">// List entries</span>
        <span class="items-progress">{{ items_done }}/{{ items_total }}</span>
    </div>

    {% if items %}
    <ul class="item-list">
        {% for item in items %}
        <li class="item-row {% if item.is_done %}done{% endif %}">
            <form method="post" action="{% url 'toggle-item' task.pk item.pk %}" class="item-toggle-form">
                {% csrf_token %}
                <button type="submit" class="item-toggle" title="Toggle">
                    <span class="item-box {% if item.is_done %}checked{% endif %}"></span>
                </button>
            </form>

            <span class="item-name">{{ item.name }}</span>

            <form method="post" action="{% url 'delete-item' task.pk item.pk %}" class="item-delete-form">
                {% csrf_token %}
                <button type="submit" class="item-delete" title="Remove">&times;</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="items-empty">No entries listed</div>
    {% endif %}

       <form method="post" action="{% url 'add-item' task.pk %}" class="item-add">
        {% csrf_token %}
        <span class="item-add-box"></span>
        <input type="text" name="name" class="item-add-name"
               placeholder="Add entry..." maxlength="50" required autofocus>
        <button type="submit">Add</button>
    </form>
</div>
